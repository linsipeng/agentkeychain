name: Disposable pinned SQLite fixture

on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pilot-sqlite-fixture.yml'
      - 'tests/native/pilot_sqlite*.c'
      - 'tests/native/pilot_broker_unix_peer.c'
      - 'tests/native/pilot_broker_unix_receipt.c'
      - 'tests/native/pilot_broker_unix_inspect.c'
      - 'tests/native/pilot_linux_installed_inspect_*'
      - 'native/pilot-linux-*.c'
      - 'native/pilot-linux-*.h'
      - 'src/cloud/continuation-pilot-native-*.ts'
      - 'tests/native/PILOT_BROKER_UNIX_INSPECT.md'
      - 'tests/native/PILOT_SQLITE_DIRFD_ACCEPTANCE.md'

permissions:
  contents: read

jobs:
  sqlite-fixture:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - name: Check out exact draft head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned official SQLite and build standalone fixtures
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          fixture=$(mktemp -d "$RUNNER_TEMP/akc-sqlite.XXXXXXXX")
          base=(-std=c11 -Wall -Wextra -Werror -pedantic)
          if [[ "$(uname -s)" == Darwin ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
            test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
            base+=(-D_DARWIN_C_SOURCE=1)
          fi
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
            --max-time 45 --max-filesize 6000000 \
            -o "$fixture/official.zip" https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python3 - "$fixture" <<'PY'
          import hashlib, pathlib, sys, zipfile
          directory = pathlib.Path(sys.argv[1])
          archive = directory / 'official.zip'
          assert hashlib.sha3_256(archive.read_bytes()).hexdigest() == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30'
          with zipfile.ZipFile(archive) as source:
              for name in ('sqlite3.c', 'sqlite3.h'):
                  entry = 'sqlite-amalgamation-3540100/' + name
                  assert 0 < source.getinfo(entry).file_size <= 15_000_000
                  data = source.read(entry)
                  (directory / name).write_bytes(data)
          assert hashlib.sha3_256((directory / 'sqlite3.c').read_bytes()).hexdigest() == 'e2b869d3003b33c942b7dd7063604fbc53553e1b66609570df39b9b7b558ee81'
          PY
          cc "${base[@]}" tests/native/pilot_sqlite_dirfd_gate.c -o "$fixture/path-gate"
          cc "${base[@]}" tests/native/pilot_sqlite_writer_lease.c -o "$fixture/lease"
          cc "${base[@]}" tests/native/pilot_broker_unix_peer.c -o "$fixture/broker-peer"
          cc -O2 -DSQLITE_OMIT_WAL=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_TEMP_STORE=3 \
            -c "$fixture/sqlite3.c" -o "$fixture/sqlite3.o"
          for test in pilot_sqlite_engine_readonly pilot_sqlite_rollback_writer pilot_sqlite_broker_receipt; do
            cc "${base[@]}" -I"$fixture" -c "tests/native/$test.c" -o "$fixture/$test.o"
            cc "$fixture/$test.o" "$fixture/sqlite3.o" -lm -lpthread -o "$fixture/$test"
          done
          printf 'AKC_SQLITE_FIXTURE_DIR=%s\n' "$fixture" >> "$GITHUB_ENV"

      - name: Exercise isolated path, lease, read, rollback, and receipt behavior
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          "$AKC_SQLITE_FIXTURE_DIR/path-gate"
          "$AKC_SQLITE_FIXTURE_DIR/lease"
          "$AKC_SQLITE_FIXTURE_DIR/pilot_sqlite_engine_readonly"
          "$AKC_SQLITE_FIXTURE_DIR/pilot_sqlite_rollback_writer"
          "$AKC_SQLITE_FIXTURE_DIR/pilot_sqlite_broker_receipt"

      - name: Verify kernel peer identity on a private Unix socket
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          "$AKC_SQLITE_FIXTURE_DIR/broker-peer"

      - name: Verify signed fixed broker request and durable receipt together
        if: matrix.runner == 'ubuntu-24.04'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          pkg-config --atleast-version=3.0.0 libcrypto
          fixture="$AKC_SQLITE_FIXTURE_DIR"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -I"$fixture" -c tests/native/pilot_broker_unix_receipt.c -o "$fixture/broker-receipt.o"
          cc "$fixture/broker-receipt.o" "$fixture/sqlite3.o" -lm -lpthread -lcrypto -o "$fixture/broker-receipt"
          "$fixture/broker-receipt"

      - name: Read exact durable snapshot through authenticated native inspect
        if: matrix.runner == 'ubuntu-24.04'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          pkg-config --atleast-version=3.0.0 libcrypto
          fixture="$AKC_SQLITE_FIXTURE_DIR"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -I"$fixture" -c tests/native/pilot_broker_unix_inspect.c -o "$fixture/broker-inspect.o"
          cc "$fixture/broker-inspect.o" "$fixture/sqlite3.o" -lm -lpthread -lcrypto -o "$fixture/broker-inspect"
          "$fixture/broker-inspect"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runner == 'ubuntu-24.04'
        with:
          bun-version: '1.4.5'

      - name: Verify a separately installed pilot against sealed native SQLite reader
        if: matrix.runner == 'ubuntu-24.04'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          pkg-config --atleast-version=3.0.0 libcrypto
          bun install --frozen-lockfile --ignore-scripts
          bun test ./tests/native/pilot_linux_installed_inspect_rehearsal.ts
