name: Disposable pinned SQLite fixture

on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pilot-sqlite-fixture.yml'
      - 'tests/native/pilot_sqlite*.c'
      - 'tests/native/PILOT_SQLITE_DIRFD_ACCEPTANCE.md'

permissions:
  contents: read

jobs:
  sqlite-fixture:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - name: Check out exact draft head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned official SQLite and build four standalone fixtures
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          fixture=$(mktemp -d "$RUNNER_TEMP/akc-sqlite.XXXXXXXX")
          base=(-std=c11 -Wall -Wextra -Werror -pedantic)
          if [[ "$(uname -s)" == Darwin ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
            test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
            base+=(-D_DARWIN_C_SOURCE=1)
          fi
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
            --max-time 45 --max-filesize 6000000 \
            -o "$fixture/official.zip" https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python3 - "$fixture" <<'PY'
          import hashlib, pathlib, sys, zipfile
          directory = pathlib.Path(sys.argv[1])
          archive = directory / 'official.zip'
          assert hashlib.sha3_256(archive.read_bytes()).hexdigest() == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30'
          with zipfile.ZipFile(archive) as source:
              for name in ('sqlite3.c', 'sqlite3.h'):
                  entry = 'sqlite-amalgamation-3540100/' + name
                  assert 0 < source.getinfo(entry).file_size <= 15_000_000
                  data = source.read(entry)
                  (directory / name).write_bytes(data)
          assert hashlib.sha3_256((directory / 'sqlite3.c').read_bytes()).hexdigest() == 'e2b869d3003b33c942b7dd7063604fbc53553e1b66609570df39b9b7b558ee81'
          PY
          cc "${base[@]}" tests/native/pilot_sqlite_dirfd_gate.c -o "$fixture/path-gate"
          cc "${base[@]}" tests/native/pilot_sqlite_writer_lease.c -o "$fixture/lease"
          cc -O2 -DSQLITE_OMIT_WAL=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_TEMP_STORE=3 \
            -c "$fixture/sqlite3.c" -o "$fixture/sqlite3.o"
          for test in pilot_sqlite_engine_readonly pilot_sqlite_rollback_writer; do
            cc "${base[@]}" -I"$fixture" -c "tests/native/$test.c" -o "$fixture/$test.o"
            cc "$fixture/$test.o" "$fixture/sqlite3.o" -lm -lpthread -o "$fixture/$test"
          done
          printf 'AKC_SQLITE_FIXTURE_DIR=%s\n' "$fixture" >> "$GITHUB_ENV"

      - name: Exercise isolated path, lease, read, and rollback behavior
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          "$AKC_SQLITE_FIXTURE_DIR/path-gate"
          "$AKC_SQLITE_FIXTURE_DIR/lease"
          "$AKC_SQLITE_FIXTURE_DIR/pilot_sqlite_engine_readonly"
          "$AKC_SQLITE_FIXTURE_DIR/pilot_sqlite_rollback_writer"
