name: Release candidate packaging

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: ubuntu-24.04, target: linux-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - name: Pin native macOS compiler
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Type-check the isolated macOS Keychain test (do not run it)
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        run: xcrun swiftc -typecheck tests/native/pilot_darwin_keychain.swift
      - name: Verify native packaging with synthetic policy
        if: github.event_name == 'pull_request'
        env:
          TARGET: ${{ matrix.target }}
        run: bun scripts/package-release.ts candidate "$TARGET" dist
      - name: Package exact signed production policy for version tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TARGET: ${{ matrix.target }}
          AKC_RELEASE_ID: ${{ vars.AKC_RELEASE_ID }}
          AKC_RELEASE_MANIFEST: ${{ vars.AKC_RELEASE_MANIFEST }}
          AKC_RELEASE_ROOT_PUBLIC_KEY: ${{ vars.AKC_RELEASE_ROOT_PUBLIC_KEY }}
        run: bun scripts/package-release.ts tagged "$TARGET" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-target-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-target-*
          merge-multiple: true
          path: dist
      - name: Enforce exact file set and checksum every asset
        run: |
          bun scripts/package-release.ts manifest dist
          bun scripts/package-release.ts verify dist
      - name: Test package and installer contracts
        run: bun test tests/release-packaging.test.ts tests/cloud-installer.test.ts
      - name: Install isolated test dependencies
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: npm ci --ignore-scripts --prefix managed-cloud
      - name: Validate exact tagged source before publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          isolated="$(mktemp -d "$RUNNER_TEMP/akc-release-test.XXXXXXXX")"
          export HOME="$isolated" XDG_CONFIG_HOME="$isolated/config" XDG_DATA_HOME="$isolated/data"
          export AKC_KEYCHAIN_TEST_MODE=1
          unset AGENTKEYCHAIN_HOME AKC_PASSWORD AKC_KEYCHAIN_SECURITY_BIN AKC_KEYCHAIN_SECRET_TOOL_BIN AKC_KEYCHAIN_TEST_STUB_ROOT
          bun run lint
          bun run typecheck
          bun test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'synthetic-release-candidate' || 'signed-release-candidate' }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure this environment with required release reviewers and version-tag
    # restrictions before cutting a tag. PR jobs cannot reach this job.
    environment: managed-cloud-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-candidate
          path: dist
      - name: Publish the approved version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AKC_RELEASE_APPROVED_SHA: ${{ vars.AKC_RELEASE_APPROVED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          current="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)"
          built="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .sha)"
          [[ "$current" == "$built" && "$built" =~ ^[a-f0-9]{40}$ && "$AKC_RELEASE_APPROVED_SHA" == "$built" ]]
          cd dist
          sha256sum --strict -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            agentkeychain-darwin-arm64 agentkeychain-darwin-x64 \
            agentkeychain-linux-arm64 agentkeychain-linux-x64 \
            agentkeychain-secure-store-darwin-arm64 agentkeychain-secure-store-darwin-x64 SHA256SUMS
