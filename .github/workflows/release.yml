name: Release

# On version tags: build all 4 targets, generate SHA256SUMS, attach to the release.
# Binaries are built in CI — never hand-built locally.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: agentkeychain-darwin-arm64
          - target: bun-darwin-x64
            asset: agentkeychain-darwin-x64
          - target: bun-linux-x64
            asset: agentkeychain-linux-x64
          - target: bun-linux-arm64
            asset: agentkeychain-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build ${{ matrix.asset }}
        run: bun build src/cli/index.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum agentkeychain-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentkeychain-*
            dist/SHA256SUMS
