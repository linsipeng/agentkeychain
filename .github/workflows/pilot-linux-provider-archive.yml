name: Disposable Ubuntu provider archive

on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pilot-linux-provider-archive.yml'
      - 'tests/native/pilot_linux_ubuntu_provider_stage.py'

permissions:
  contents: read

jobs:
  verify-archive-only:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact packages without installing or executing them
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            AKC_UBUNTU_PROVIDER_STAGE=archive-only-v1 /usr/bin/timeout 220s /usr/bin/python3 -I \
            tests/native/pilot_linux_ubuntu_provider_stage.py
