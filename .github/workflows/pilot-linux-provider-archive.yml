name: Disposable Ubuntu provider prompt cancellation

on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pilot-linux-provider-archive.yml'
      - 'tests/native/pilot_linux_ubuntu_provider_stage.py'
      - 'tests/native/pilot_linux_private_secret_bus.py'
      - 'tests/native/pilot_linux_private_display.py'
      - 'tests/native/pilot_linux_named_write.py'

permissions:
  contents: read

jobs:
  verify-private-peer:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify isolated provider, encrypted session and non-mutating collection offer
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            AKC_UBUNTU_PROVIDER_STAGE=collection-offer-v1 /usr/bin/timeout 220s /usr/bin/python3 -I \
            tests/native/pilot_linux_ubuntu_provider_stage.py

      - name: Verify and cancel one real disposable prompt without entering a password
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted AKC_UBUNTU_PROVIDER_STAGE=prompt-cancel-v1 /usr/bin/timeout 220s /usr/bin/python3 -I tests/native/pilot_linux_ubuntu_provider_stage.py

  verify-named-write:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create one isolated fixture store and write one encrypted test item
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            AKC_UBUNTU_PROVIDER_STAGE=named-write-v1 /usr/bin/timeout 220s /usr/bin/python3 -I \
            tests/native/pilot_linux_ubuntu_provider_stage.py

  verify-named-reopen:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restart the isolated store and decrypt the exact original test item
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            AKC_UBUNTU_PROVIDER_STAGE=named-reopen-v1 /usr/bin/timeout 220s /usr/bin/python3 -I \
            tests/native/pilot_linux_ubuntu_provider_stage.py

  verify-named-reopen-protected-signer:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restart the isolated store and verify one recovered-seed signature
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            AKC_UBUNTU_PROVIDER_STAGE=named-reopen-signer-v1 /usr/bin/timeout 220s /usr/bin/python3 -I \
            tests/native/pilot_linux_ubuntu_provider_stage.py
