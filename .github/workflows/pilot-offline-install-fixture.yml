name: Disposable pilot offline install fixture
on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pilot-offline-install-fixture.yml'
      - 'scripts/build-continuation-pilot.ts'
      - 'src/cli/continuation-pilot*.ts'
      - 'src/cloud/continuation-pilot*.ts'
      - 'tests/cloud-continuation-pilot-build.test.ts'
      - 'tests/native/pilot_offline_package.ts'
      - 'native/pilot-linux-descriptor-launch.*'
      - 'tests/native/pilot_linux_descriptor_*.c'

permissions:
  contents: read

jobs:
  offline-install:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, machine: x86_64, bunArch: x64}
          - {runner: ubuntu-24.04-arm, machine: aarch64, bunArch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - name: Rehearse exact local install on a disposable runner
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_BUN_ARCH: ${{ matrix.bunArch }}
        run: |
          set -eu
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          bun -e 'if (process.arch !== process.env.EXPECTED_BUN_ARCH) process.exit(1)'
          bun test tests/cloud-continuation-pilot-build.test.ts --test-name-pattern 'offline pilot smoke installs'

      - name: Verify sealed descriptor execution in the disposable install
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          pkg-config --atleast-version=3.0.0 libcrypto
          fixture=$(mktemp -d "$RUNNER_TEMP/akc-fd-launch.XXXXXXXX")
          trap 'rm -rf -- "$fixture"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -pedantic -static tests/native/pilot_linux_descriptor_target.c -o "$fixture/reader"
          chmod 0500 "$fixture/reader"
          digest=$(sha256sum "$fixture/reader" | cut -d ' ' -f 1)
          cc -std=c11 -Wall -Wextra -Werror -pedantic native/pilot-linux-descriptor-launch.c tests/native/pilot_linux_descriptor_launch.c -lcrypto -o "$fixture/smoke"
          "$fixture/smoke" "$fixture" "$digest"
