name: Disposable Darwin Keychain acceptance

# The workflow can run on the takeover PR before this file exists on the
# default branch. It never runs against a fork or on a release event.
on:
  pull_request:
    branches: [handoff/managed-cloud-ai-20261121]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/darwin-disposable-keychain.yml'
      - 'tests/native/pilot_darwin_keychain.swift'
      - 'tests/native/pilot_darwin_keychain_config_digest.sh'
      - 'native/continuation-pilot-keychain-check.swift'
      - 'scripts/build-continuation-pilot-darwin-check.ts'
      - 'src/cloud/continuation-pilot-darwin-check.ts'
      - 'tests/native/pilot_darwin_signed_wire.ts'
      - 'tests/native/pilot_darwin_compiled_fixture*.ts'

permissions:
  contents: read

jobs:
  disposable-keychain:
    if: >-
      ${{ github.repository == 'linsipeng/agentkeychain' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Record initial user Keychain configuration digest
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(/usr/bin/uname -m)" = '${{ matrix.arch }}'
          /bin/bash tests/native/pilot_darwin_keychain_config_digest.sh \
            > "$RUNNER_TEMP/akc-keychain-config.before.sha256"

      - name: Compile only the standalone fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          /usr/bin/xcrun swiftc tests/native/pilot_darwin_keychain.swift \
            -o "$RUNNER_TEMP/akc-darwin-keychain-fixture"

      - name: Type-check separate read-only companion without executing it
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/akc-read-only-swift.XXXXXXXX")
          /bin/cp native/continuation-pilot-keychain-check.swift "$dir/main.swift"
          cat > "$dir/PilotNativeTrust.swift" <<'SWIFT'
          enum PilotNativeTrust {
              static let rolloutPublicKey = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
              static let installationDigest = String(repeating: "0", count: 64)
              static let expiresAt: Int64 = 0
          }
          SWIFT
          /usr/bin/xcrun swiftc -typecheck "$dir/PilotNativeTrust.swift" "$dir/main.swift"

      - name: Exercise two new disposable Keychains
        timeout-minutes: 2
        shell: bash
        env:
          AKC_DISPOSABLE_DARWIN_FIXTURE: create-two-private-keychains-v1
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/akc-darwin-keychain-fixture" --provision-disposable

      - name: Independently check user Keychain configuration after attempt
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/akc-keychain-config.before.sha256"
          if ! after=$(/bin/bash tests/native/pilot_darwin_keychain_config_digest.sh); then
            echo 'User Keychain configuration post-check unavailable' >&2
            exit 1
          fi
          if [[ ! -s "$before" ]] || [[ "$after" != "$(<"$before")" ]]; then
            echo 'User Keychain configuration unchanged could not be verified' >&2
            exit 1
          fi
          echo 'PASS independent user Keychain configuration unchanged'

      - name: Set up pinned Bun for the synthetic signed-wire fixture
        id: signed_wire_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
          no-cache: true

      - name: Prepare locked dependencies without lifecycle hooks
        timeout-minutes: 2
        env:
          AKC_SIGNED_WIRE_BUN: ${{ steps.signed_wire_bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          [[ "$AKC_SIGNED_WIRE_BUN" == /* ]] && test -x "$AKC_SIGNED_WIRE_BUN"
          "$AKC_SIGNED_WIRE_BUN" install --frozen-lockfile --ignore-scripts

      - name: Verify signed disposable native wire and compiled fixture CLI
        timeout-minutes: 6
        shell: bash
        env:
          AKC_EXPECTED_DARWIN_ARCH: ${{ matrix.arch }}
          AKC_SIGNED_WIRE_REHEARSAL: private-fixture-only-v1
          AKC_SIGNED_WIRE_COMPILED_CLI: check-native-fixture-v1
          AKC_SIGNED_WIRE_BUN: ${{ steps.signed_wire_bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$AKC_SIGNED_WIRE_BUN" == /* ]] && test -x "$AKC_SIGNED_WIRE_BUN"
          "$AKC_SIGNED_WIRE_BUN" tests/native/pilot_darwin_signed_wire.ts

      - name: Independently recheck configuration after signed-wire attempt
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/akc-keychain-config.before.sha256"
          if ! after=$(/bin/bash tests/native/pilot_darwin_keychain_config_digest.sh); then
            echo 'Final user Keychain configuration check unavailable' >&2
            exit 1
          fi
          if [[ ! -s "$before" ]] || [[ "$after" != "$(<"$before")" ]]; then
            echo 'Final user Keychain configuration unchanged could not be verified' >&2
            exit 1
          fi
          echo 'PASS final independent user Keychain configuration unchanged'
