name = "agentkeychain-managed-api"
main = "index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "MAIN"
database_name = "managed-main-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
remote = false

[[services]]
binding = "RECOVERY"
service = "agentkeychain-managed-custodian"
entrypoint = "Custodian"

# Trusted ingress/email adapters are separate provisioning/review gates.
# Local bundle tests supply synthetic implementations under these exact names.
[[services]]
binding = "EMAIL_VERIFIER"
service = "agentkeychain-auth-trust"
entrypoint = "EmailVerifier"

[[services]]
binding = "TRUSTED_AUTH_SOURCE"
service = "agentkeychain-auth-trust"
entrypoint = "TrustedAuthSource"

# Service owns its signing key; the API receives signatures and public metadata only.
[[services]]
binding = "CHECKPOINT_SIGNER"
service = "agentkeychain-checkpoint-signer"
entrypoint = "CheckpointSigner"

# Independently provisioned recovery operator bindings; no private key in D1.
[[services]]
binding = "RECOVERY_AUTH"
service = "agentkeychain-api-recovery"
entrypoint = "RecoveryAuthority"

[[services]]
binding = "RECOVERY_KEYS"
service = "agentkeychain-api-recovery"
entrypoint = "RecoveryKeys"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
