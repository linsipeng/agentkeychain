# Local-only manifest. Deployment uses provisioning/render.mjs with actual resource IDs and public pins.
name = "agentkeychain-cloud-custody-trust"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
main = "index.ts"

[observability]
enabled = false

[[d1_databases]]
binding = "TRUST_DB"
database_name = "agentkeychain-cloud-custodian"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "../recovery-worker/migrations"
remote = false
